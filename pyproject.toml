[project]
name = "kanbain"
version = "0.1.0"
description = "A plan editor with a controlled Gantt and an MCP agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "python-multipart>=0.0.20,<1",
  "honker==0.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
