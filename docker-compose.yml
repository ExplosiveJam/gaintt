services:
  gaintt:
    build: .
    ports:
      - "8000:8000"
    environment:
      GAINTT_DB_PATH: /data/gaintt.sqlite
      MCP_HTTP_ENABLED: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - gaintt-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gaintt-data:
