services:
  - type: web
    name: gaintt
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GAINTT_DB_PATH
        value: /tmp/gaintt.sqlite
      - key: MCP_HTTP_ENABLED
        value: "false"
      - key: GAINTT_COOKIE_SECURE
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
