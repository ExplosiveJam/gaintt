services:
  - type: web
    name: kanbain
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: KANBAIN_DB_PATH
        value: /data/kanbain.sqlite
      - key: MCP_HTTP_ENABLED
        value: "false"
      - key: KANBAIN_COOKIE_SECURE
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: kanbain-data
      mountPath: /data
      sizeGB: 1
